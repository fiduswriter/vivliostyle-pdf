<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
  <rect width="480" height="240" fill="#ffffff"/>
  <text x="240" y="28" font-family="serif" font-size="17" text-anchor="middle" fill="#333">Latency by payload size</text>
  <!-- axes -->
  <line x1="60" y1="200" x2="440" y2="200" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="200" x2="60" y2="50" stroke="#333" stroke-width="1.5"/>
  <!-- gridlines -->
  <g stroke="#ddd">
    <line x1="60" y1="162.5" x2="440" y2="162.5"/>
    <line x1="60" y1="125" x2="440" y2="125"/>
    <line x1="60" y1="87.5" x2="440" y2="87.5"/>
  </g>
  <!-- polyline series -->
  <polyline points="80,180 150,160 220,140 290,110 360,85 420,60"
    fill="none" stroke="#2456a6" stroke-width="2.5"/>
  <polyline points="80,188 150,175 220,158 290,138 360,115 420,95"
    fill="none" stroke="#3d8b37" stroke-width="2.5" stroke-dasharray="6 3"/>
  <g fill="#2456a6">
    <circle cx="80" cy="180" r="4"/><circle cx="150" cy="160" r="4"/>
    <circle cx="220" cy="140" r="4"/><circle cx="290" cy="110" r="4"/>
    <circle cx="360" cy="85" r="4"/><circle cx="420" cy="60" r="4"/>
  </g>
  <g fill="#3d8b37">
    <rect x="76" y="184" width="8" height="8"/><rect x="146" y="171" width="8" height="8"/>
    <rect x="216" y="154" width="8" height="8"/><rect x="286" y="134" width="8" height="8"/>
    <rect x="356" y="111" width="8" height="8"/><rect x="416" y="91" width="8" height="8"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#333">
    <text x="80" y="216" text-anchor="middle">1 KB</text>
    <text x="150" y="216" text-anchor="middle">10 KB</text>
    <text x="220" y="216" text-anchor="middle">100 KB</text>
    <text x="290" y="216" text-anchor="middle">1 MB</text>
    <text x="360" y="216" text-anchor="middle">5 MB</text>
    <text x="420" y="216" text-anchor="middle">10 MB</text>
    <text x="70" y="45" fill="#2456a6">— emitter A</text>
    <text x="160" y="45" fill="#3d8b37">- - emitter B</text>
  </g>
</svg>
